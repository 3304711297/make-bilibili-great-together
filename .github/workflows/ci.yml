name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # 版本由根 package.json 的 packageManager 字段唯一决定，此处不得重复声明
        with: { run_install: null }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: 产物冒烟
        run: |
          test -f packages/userscript/dist/make-bilibili-great-together.user.js
          grep -q "==UserScript==" packages/userscript/dist/make-bilibili-great-together.user.js
