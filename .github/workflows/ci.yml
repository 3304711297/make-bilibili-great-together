name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 版本由根 package.json 的 packageManager 字段唯一决定，此处不得重复声明
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: 扩展产物断言
        run: |
          test -f packages/extension/dist/manifest.json
          test -f packages/extension/dist/main.js
          test -f packages/extension/dist/background.js
          test -f packages/extension/make-bilibili-great-together-extension.zip
      - name: 产物冒烟
        run: |
          test -f packages/userscript/dist/make-bilibili-great-together.user.js
          grep -q "==UserScript==" packages/userscript/dist/make-bilibili-great-together.user.js
