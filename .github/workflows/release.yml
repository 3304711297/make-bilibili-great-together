name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 版本由根 package.json 的 packageManager 字段唯一决定，此处不得重复声明
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: 构建 userscript
        run: pnpm --filter @mbgt/userscript build
      - name: 构建扩展
        run: pnpm --filter @mbgt/extension build
      - name: 产物断言
        run: |
          test -f packages/userscript/dist/make-bilibili-great-together.user.js
          grep -q "==UserScript==" packages/userscript/dist/make-bilibili-great-together.user.js
          test -f packages/extension/make-bilibili-great-together-extension.zip
          grep -q "@version" packages/userscript/dist/make-bilibili-great-together.user.js
      - name: 发布 Release（自动 notes + 产物）
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            packages/userscript/dist/make-bilibili-great-together.user.js
            packages/extension/make-bilibili-great-together-extension.zip
