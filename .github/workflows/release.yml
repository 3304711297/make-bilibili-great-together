name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 版本由根 package.json 的 packageManager 字段唯一决定，此处不得重复声明
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: 构建 userscript
        run: pnpm --filter @mbgt/userscript build
      - name: 构建扩展
        run: pnpm --filter @mbgt/extension build
      - name: 产物断言
        run: |
          test -f packages/userscript/dist/make-bilibili-great-together.user.js
          grep -q "==UserScript==" packages/userscript/dist/make-bilibili-great-together.user.js
          test -f packages/extension/make-bilibili-great-together-extension.zip
          grep -q "@version" packages/userscript/dist/make-bilibili-great-together.user.js
      - name: 发布 Release（自动 notes + 产物）
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: |
            packages/userscript/dist/make-bilibili-great-together.user.js
            packages/extension/make-bilibili-great-together-extension.zip
