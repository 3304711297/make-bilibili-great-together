name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # 版本由根 package.json 的 packageManager 字段唯一决定，此处不得重复声明
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: 构建 userscript
        run: pnpm --filter @mbgt/userscript build
      - name: 构建扩展
        run: pnpm --filter @mbgt/extension build
      - name: 产物断言
        run: |
          test -f packages/userscript/dist/make-bilibili-great-together.user.js
          grep -q "==UserScript==" packages/userscript/dist/make-bilibili-great-together.user.js
          test -f packages/extension/make-bilibili-great-together-extension.zip
          grep -q "@version" packages/userscript/dist/make-bilibili-great-together.user.js
      - name: 发布 Release（自动 notes + 产物）
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            packages/userscript/dist/make-bilibili-great-together.user.js
            packages/extension/make-bilibili-great-together-extension.zip
