# 上游同步看门：每日检查 SukkaW 上游 HEAD 是否前进，变化则开 Issue 提醒评估 cherry-pick。
# 状态存放在带 upstream-sync 标签的 Issue 正文里（无额外存储）；同 SHA 幂等空转。
# 移植基线：2026-08-30（upstream master 19ac3ae）；本仓库为移植重写非 fork，同步走人工评估 cherry-pick。
name: Upstream Watch

on:
  schedule:
    - cron: '0 2 * * *' # 每日 UTC 02:00（北京 10:00）
  workflow_dispatch:

permissions:
  issues: write

env:
  UPSTREAM_REPO: SukkaW/Make-Bilibili-Great-Than-Ever-Before
  LABEL: upstream-sync

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UP_SHA=$(gh api "repos/$UPSTREAM_REPO/commits/master" --jq .sha)
          UP_DATE=$(gh api "repos/$UPSTREAM_REPO/commits/master" --jq .commit.committer.date)
          echo "上游 HEAD: ${UP_SHA:0:7} ($UP_DATE)"

          ISSUE_NUMBER=$(gh api "repos/${{ github.repository }}/issues?labels=$LABEL&state=open&per_page=1" --jq '.[0].number // empty')
          RECORDED=""
          if [ -n "$ISSUE_NUMBER" ]; then
            RECORDED=$(gh api "repos/${{ github.repository }}/issues/$ISSUE_NUMBER" --jq '.body' \
              | grep -oP '记录 SHA：\K[0-9a-f]{40}' || true)
          fi

          if [ "$RECORDED" = "$UP_SHA" ]; then
            echo "记录 SHA 与上游一致，无更新，幂等空转"
            exit 0
          fi

          # 变更清单：取记录 SHA 之后（无记录则最近 10 条）的上游提交
          SINCE="1970-01-01T00:00:00Z"
          if [ -n "$RECORDED" ]; then
            SINCE=$(gh api "repos/$UPSTREAM_REPO/commits/$RECORDED" --jq .commit.committer.date || echo "1970-01-01T00:00:00Z")
          fi
          LOG=$(gh api "repos/$UPSTREAM_REPO/commits?sha=master&per_page=20" \
            --jq ".[] | select(.commit.committer.date > \"$SINCE\") | .sha[:7] + \" \" + (.commit.committer.date[:10]) + \" \" + (.commit.message | split(\"\n\")[0])")
          [ -n "$LOG" ] || LOG="(未取到增量清单，请直接查看上游提交历史)"

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue close "$ISSUE_NUMBER" --repo "${{ github.repository }}" \
              --comment "该批更新已评估处置完毕；检测到上游再次前进，转为追踪新一批（新 Issue 记录 SHA：$UP_SHA）。" || true
          fi

          {
            echo '## 上游同步提醒'
            echo ''
            echo "- 上游 HEAD：\`${UP_SHA:0:7}\`（$UP_DATE）"
            echo "- 记录 SHA：$UP_SHA"
            echo ''
            echo "### 新增提交（自 $SINCE 起）"
            echo ''
            echo '```'
            echo "$LOG"
            echo '```'
            echo ''
            echo '### 处置流程'
            echo ''
            echo '1. 逐条评估新提交对本仓库移植代码的影响（packages/core/src/modules、engine、features）；'
            echo '2. 适用的改动移植并补测试；不适用的在本 Issue 说明原因；'
            echo '3. 评估完成后关闭本 Issue（下次检测到上游前进会开新 Issue 并更新记录 SHA）。'
          } > body.md
          gh label create "$LABEL" --repo "${{ github.repository }}" \
            --description "上游 SukkaW 更新待评估 cherry-pick" --color 5319e7 2>/dev/null || true
          gh issue create --repo "${{ github.repository }}" \
            --label "$LABEL" \
            --title "上游 SukkaW 有新提交（${UP_SHA:0:7}），请评估 cherry-pick" \
            --body-file body.md \
            --assignee "3304711297"
